<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Le Codex de l'Aventurier - Gestionnaire ultime de fiches de personnage Donjons & Dragons (5e & 2024). Gérez vos héros, sorts, inventaires, compagnons, lancers de dés et exportez vos fiches officielles en PDF.">

  <!-- OpenGraph / Social Media Link Previews -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Le Codex de l'Aventurier - Gestionnaire de Personnage D&D">
  <meta property="og:description" content="Gestionnaire ultime de fiches de personnage Donjons & Dragons (5e & 2024). Gérez vos héros, sorts, inventaires, compagnons, lancers de dés et exportez vos fiches officielles en PDF.">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- Twitter Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Le Codex de l'Aventurier - Gestionnaire de Personnage D&D">
  <meta name="twitter:description" content="Gestionnaire ultime de fiches de personnage Donjons & Dragons (5e & 2024). Gérez vos héros, sorts, inventaires, compagnons, lancers de dés et exportez vos fiches officielles en PDF.">
  <meta name="twitter:image" content="icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Le Codex de l'Aventurier">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=2.0.6">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=2.0.6"/>
  <link rel="shortcut icon" type="image/png" href="favicon.png?v=2.0.6"/>

  <title>Le Codex de l'Aventurier</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // Supprimer tous les caches du navigateur liés à l'application
    if (window.caches) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }
    // Désenregistrer tous les service workers actifs
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
